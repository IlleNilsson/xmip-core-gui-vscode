name: Verify

# Automatic push, pull-request and scheduled triggers are intentionally absent.
on:
  workflow_dispatch:
    inputs:
      update:
        description: >-
          Raise every package to its latest release first, and hand back the
          new package.json and package-lock.json; Node.js runs here alone
        type: boolean
        default: false

permissions:
  contents: read

# Two languages, two jobs: the server is verified as every Rust repository is,
# and the shell in extension/ is compiled, linted and tested the same way the
# landing gate does it (ADR-0052 clause 6).
jobs:
  rust:
    uses: IlleNilsson/.github/.github/workflows/rust-verify.yml@v1

  typescript:
    name: Verify TypeScript shell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies from the lock
        run: npm ci

      # Every package at its latest release, a major included (CONTRIBUTING),
      # and the VS Code the extension needs is the one its API types are for.
      - name: Raise every package to its latest release
        if: ${{ inputs.update }}
        run: |
          npm install $(jq -r '.dependencies // {} | keys[] | . + "@latest"' package.json)
          npm install --save-dev $(jq -r '.devDependencies // {} | keys[] | . + "@latest"' package.json)
          types=$(jq -r '.devDependencies["@types/vscode"]' package.json)
          jq --arg v "$types" '.engines.vscode = $v' package.json > package.json.new
          mv package.json.new package.json

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Handed back, never pushed: the workflow reads the repository only.
      - name: Hand back the raised manifest and lock
        if: ${{ inputs.update }}
        uses: actions/upload-artifact@v7
        with:
          name: extension-packages
          path: |
            extension/package.json
            extension/package-lock.json
