# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-gui-vscode"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-gui-vscode"
description = "The VS Code extension, the developer's face of the configuration tool: a TypeScript shell around a Rust language server that validates a node configuration through the ABI (ADR-0014, amendment 2026-09-10). A xmip-core-gui technology."
publish = false

# The substance of this repository is the language server; the TypeScript
# shell in extension/ starts it and shows what it says.
[[bin]]
name = "xmip-lsp"
# A directory of many usages keeps its source aside (ADR-0049).
path = ".src/main.rs"

[dependencies]
# The status constants and the borrowed-string layout of xmip_module.h, so the
# server declares no struct of its own over the boundary (ADR-0014, amendment
# of 2026-08-26).
abi = { package = "xmip-core-abi", git = "https://github.com/IlleNilsson/xmip-core-abi", branch = "main" }
# Loading the runtime's native library by path: the one route through the
# C ABI, the same call the desktop GUI makes through Xmip.Abi.
libloading = "0.8"
# The messages of the Language Server Protocol are JSON-RPC.
serde_json = "1"

[lints.rust]
# deny, not forbid. The server crosses the C ABI in exactly one file,
# .src/runtime.rs, where loading the library and calling xmip_validate_v1 are
# unsafe by nature; each site lifts this with its reason. Nothing else may.
unsafe_code = "deny"

[lints.clippy]
# Warned, never denied. doc/governance/rust-style.md section 3: a function
# length gate was tried in this estate's PowerShell and produced a sixteen-entry
# waiver list while catching nothing. The number worth reading is branches, and
# clippy prints both.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
